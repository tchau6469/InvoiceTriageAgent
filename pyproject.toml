[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-triage-agent"
version = "0.1.0"
description = "Human-reviewed AP invoice triage with custom hybrid RAG."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.18,<1.19",
    "pgvector>=0.4,<0.5",
    "pydantic>=2.12,<3",
    "psycopg[binary,pool]>=3.3,<3.4",
    "PyYAML>=6.0,<7",
    "SQLAlchemy>=2.0,<2.1",
]

[project.scripts]
invoice-triage-search = "invoice_triage.cli.search:main"
invoice-triage-mcp = "invoice_triage.mcp_server.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
]
embeddings = [
    "sentence-transformers>=5.7,<6",
    "transformers>=4.51,<6",
]
mcp = [
    "fastmcp==3.4.4",
]
reasoning = [
    "google-genai>=2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
invoice_triage = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: requires the local PostgreSQL/pgvector service",
]

[tool.coverage.run]
branch = true
source = ["invoice_triage"]

[tool.coverage.report]
show_missing = true
skip_covered = true
