name: invoice-triage

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-invoice_triage}
      POSTGRES_USER: ${POSTGRES_USER:-invoice_triage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username="$${POSTGRES_USER}" --dbname="$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  test:
    profiles:
      - test
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    environment:
      INVOICE_TRIAGE_ENVIRONMENT: test
      INVOICE_TRIAGE_DATABASE_URL: postgresql://${POSTGRES_USER:-invoice_triage}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-invoice_triage}
      INVOICE_TRIAGE_RUN_INTEGRATION: "1"
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - python -m alembic upgrade head && python -m pytest
    security_opt:
      - no-new-privileges:true

  migrate:
    profiles:
      - tools
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    environment:
      INVOICE_TRIAGE_ENVIRONMENT: dev
      INVOICE_TRIAGE_DATABASE_URL: postgresql://${POSTGRES_USER:-invoice_triage}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-invoice_triage}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"
    security_opt:
      - no-new-privileges:true

  load-fixtures:
    profiles:
      - tools
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    environment:
      INVOICE_TRIAGE_ENVIRONMENT: dev
      INVOICE_TRIAGE_DATABASE_URL: postgresql://${POSTGRES_USER:-invoice_triage}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-invoice_triage}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - python -m alembic upgrade head && python scripts/load_structured_fixtures.py
    restart: "no"
    security_opt:
      - no-new-privileges:true

  model-cache-init:
    profiles:
      - tools
    image: pgvector/pgvector:0.8.2-pg17-bookworm
    user: "0:0"
    entrypoint: ["chown"]
    command: ["-R", "10001:10001", "/model-cache"]
    volumes:
      - huggingface-cache:/model-cache
    restart: "no"
    security_opt:
      - no-new-privileges:true

  ingest-documents:
    profiles:
      - tools
    build:
      context: .
      dockerfile: Dockerfile
      target: ingestion
    environment:
      INVOICE_TRIAGE_ENVIRONMENT: dev
      INVOICE_TRIAGE_DATABASE_URL: postgresql://${POSTGRES_USER:-invoice_triage}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-invoice_triage}
      INVOICE_TRIAGE_EMBEDDING_MODEL_ID: ${INVOICE_TRIAGE_EMBEDDING_MODEL_ID:-Qwen/Qwen3-Embedding-0.6B}
      INVOICE_TRIAGE_EMBEDDING_DIMENSIONS: ${INVOICE_TRIAGE_EMBEDDING_DIMENSIONS:-1024}
      INVOICE_TRIAGE_EMBEDDING_DEVICE: ${INVOICE_TRIAGE_EMBEDDING_DEVICE:-cpu}
      INVOICE_TRIAGE_EMBEDDING_BATCH_SIZE: ${INVOICE_TRIAGE_EMBEDDING_BATCH_SIZE:-8}
      HF_HOME: /home/invoice-triage/.cache/huggingface
    volumes:
      - huggingface-cache:/home/invoice-triage/.cache/huggingface
    depends_on:
      model-cache-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - python -m alembic upgrade head && python scripts/ingest_grounding_documents.py
    restart: "no"
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  huggingface-cache:
